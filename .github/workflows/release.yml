name: Release

# Packaging a Foundry module by hand is easy to get subtly wrong: the release
# has to carry module.json as its own asset (that is what the manifest URL
# resolves to), the zip has to have module.json at its root, and the download
# URL inside the packaged manifest has to point at this exact tag. This does
# all three from the tag, so releasing is just: bump version, tag, push.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run tests
        run: node --test tests/*.test.mjs

      - name: Resolve version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          MANIFEST_VERSION="$(node -p "require('./module.json').version")"
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag $TAG expects module.json version $VERSION, found $MANIFEST_VERSION. Bump the version field before tagging."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build package
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist/package
          # Pin the packaged manifest's download URL to this tag so the release is
          # self-consistent; the copy in the repository stays on /latest/.
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("module.json", "utf8"));
            const repo = process.env.GITHUB_REPOSITORY;
            manifest.download = `https://github.com/${repo}/releases/download/${process.env.TAG}/module.zip`;
            manifest.manifest = `https://github.com/${repo}/releases/latest/download/module.json`;
            manifest.url = `https://github.com/${repo}`;
            fs.writeFileSync("dist/package/module.json", `${JSON.stringify(manifest, null, 2)}\n`);
          '
          cp -r scripts dist/package/scripts
          cd dist/package && zip -r ../module.zip . && cd -
          cp dist/package/module.json dist/module.json

      - name: Verify package layout
        run: |
          # module.json must sit at the zip root or Foundry installs a broken module.
          unzip -l dist/module.zip
          unzip -l dist/module.zip | grep -qE ' module\.json$'
          unzip -l dist/module.zip | grep -qE ' scripts/compat\.js$'

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          NOTES=".github/release-notes-${TAG#v}.md"
          test -f "$NOTES"
          gh release create "$TAG" \
            dist/module.zip \
            dist/module.json \
            --title "$TAG" \
            --notes-file "$NOTES" \
            --generate-notes
